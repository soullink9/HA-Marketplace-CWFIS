# The Marketplace's own checks (the HACS action): the catalog requires a passing run with nothing ignored.
# See https://contributors.home-assistant.io/marketplace/reference/validation/
name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# No telemetry from any tool a job runs: GitHub CLI (gh) sends usage telemetry unless told not to, and
# DO_NOT_TRACK is the common opt-out other tools honour. tests/test_release.py checks every workflow sets both.
env:
  GH_TELEMETRY: "false"
  DO_NOT_TRACK: "1"

permissions: {}

jobs:
  validate-hacs:
    name: Marketplace checks (HACS action)
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, 2026-11-22
        with:
          category: integration
